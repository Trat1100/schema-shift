[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-shift"
version = "0.1.0"
description = "Read-only comparison of relational database schemas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Trat1100"}]
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyMySQL>=1.1,<2.0",
]

[project.scripts]
schemashift = "schemashift.cli:main"

[tool.setuptools.packages.find]
include = ["schemashift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
